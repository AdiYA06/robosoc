<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hexapod Internet Controller</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <h1>Hexapod Internet Controller - testing</h1>
          <p id="connection">Disconnected</p>
        </div>
        <div class="lock-box">
          <p id="lock-status">Lock: unknown</p>
          <button id="takeover" type="button">Take Control</button>
        </div>
      </header>

      <section class="panel auth-panel">
        <label>
          API Token
          <input id="api-token" type="password" placeholder="Paste your API token" autocomplete="off" />
        </label>
        <button id="save-token" type="button">Use Token</button>
      </section>

      <section class="pad-grid">
        <div class="panel">
          <h2>Walk Vector <span class="meta" id="walk-angle">angle --</span></h2>
          <div class="pad" id="move-pad">
            <div class="knob" id="move-knob"></div>
          </div>
          <div class="readout" id="move-readout">vx 0.00 | vy 0.00</div>
        </div>

        <div class="panel">
          <h2>Turn <span class="meta" id="turn-angle">angle +0°</span></h2>
          <div class="pad" id="turn-pad">
            <div class="knob" id="turn-knob"></div>
          </div>
          <div class="readout" id="turn-readout">turn 0.00</div>
        </div>
      </section>

      <section class="controls panel">
        <p class="key-help">Keyboard: <strong>WASD</strong> walk, <strong>J/K</strong> turn</p>
        <p class="key-help" id="speed-readout">speed 0.00</p>
        <div class="heading-row">
          <p class="key-help" id="heading-readout">heading +0°</p>
          <button id="reset-heading" class="secondary-btn" type="button">Reset Heading</button>
        </div>
        <label>
          Body Height
          <input type="range" id="height" min="-1" max="1" step="0.01" value="0" />
        </label>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
